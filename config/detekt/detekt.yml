# Overrides on top of detekt's default rule set (buildUponDefaultConfig = true in CI).
# Findings that existed when this was introduced live in config/detekt/baseline.xml; new code must pass.
naming:
  FunctionNaming:
    # Jetpack Compose functions are PascalCase.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  LongParameterList:
    # Composables take state and callbacks as parameters.
    ignoreAnnotated: ['Composable']
    functionThreshold: 8
    constructorThreshold: 12
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable']
style:
  MagicNumber:
    # Scores, thresholds and UI dimensions are everywhere in this codebase; reviewed by hand instead.
    active: false
  MaxLineLength:
    maxLineLength: 140
  WildcardImport:
    active: false
