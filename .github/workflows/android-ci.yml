name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Kotlin static analysis. Fast (no Android SDK). Tools are pinned and checksum-verified.
  #  - ktlint: the whole codebase is formatted; any new formatting issue fails.
  #  - detekt: findings that predate this job live in config/detekt/baseline.xml; new ones fail.
  kotlin-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KTLINT_VERSION: "1.8.0"
      KTLINT_SHA256: "369ad2b789f95a011f807e1fcb690ccef80bd7cd014fd139e73ae82dcc0baeab"
      DETEKT_VERSION: "1.23.8"
      DETEKT_SHA256: "3afe89a11120303c73c9bdda3d8fe558dd9070a6937d27819ddc04b275381245"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Download ktlint and detekt (verified)
        run: |
          curl -sSfL -o ktlint.jar "https://repo1.maven.org/maven2/com/pinterest/ktlint/ktlint-cli/${KTLINT_VERSION}/ktlint-cli-${KTLINT_VERSION}-all.jar"
          curl -sSfL -o detekt.jar "https://repo1.maven.org/maven2/io/gitlab/arturbosch/detekt/detekt-cli/${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}-all.jar"
          echo "${KTLINT_SHA256}  ktlint.jar" | sha256sum -c -
          echo "${DETEKT_SHA256}  detekt.jar" | sha256sum -c -
          mkdir -p build/reports

      - name: ktlint
        run: java -jar ktlint.jar --reporter=plain --reporter=checkstyle,output=build/reports/ktlint.xml "app/src/**/*.kt"

      - name: detekt
        if: success() || failure()
        run: |
          java -jar detekt.jar \
            --input app/src/main/java,app/src/test/java,app/src/androidTest/java \
            --config config/detekt/detekt.yml --build-upon-default-config \
            --baseline config/detekt/baseline.xml \
            --report html:build/reports/detekt.html --report sarif:build/reports/detekt.sarif

      - name: Upload lint reports
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kotlin-lint-reports
          path: build/reports/
          if-no-files-found: warn

  build-test-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install Android SDK packages (compileSdk 36.1)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0" > /dev/null

      - name: Create debug keystore (not committed; required by the debug signingConfig)
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests + record screenshots and GIFs (Roborazzi)
        run: ./gradlew :app:recordRoborazziDebug --stacktrace

      - name: Android lint (report only for now)
        if: success() || failure()
        continue-on-error: true
        run: ./gradlew :app:lintDebug

      - name: Upload screenshots and GIFs
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn

      - name: Upload Room schemas
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # SQLCipher's native library only loads on a real Android runtime, so encryption at rest is
  # tested on an emulator (KVM-accelerated on GitHub's Linux runners).
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install Android SDK packages (compileSdk 36.1)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0" > /dev/null

      - name: Create debug keystore (not committed; required by the debug signingConfig)
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Instrumented tests on emulator (API 34)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
